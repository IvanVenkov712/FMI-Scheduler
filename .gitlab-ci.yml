# GitLab CI/CD Pipeline for w26-fmischeduler

image: docker:latest
stages:
  - build
  - deploy
variables:
  DOCKER_DRIVER: overlay2
  CI_CONFIG_HASH: f9bcc2bb76fc6bf836c56bcba944ab00784eb5f0ad428d0dd3dae04916ab5f76
.before_script_common:
  variables: {}
  before_script:
    - apk add --no-cache curl bash
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - |-
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "Using docker-compose.main.yaml"
        cp -rf .secure_files/docker-compose.main.yaml docker-compose.yml
        ls -la
      elif [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        echo "Using docker-compose.dev.yaml"
        cp -rf .secure_files/docker-compose.dev.yaml docker-compose.yml
      else
        echo "Unsupported branch: $CI_COMMIT_BRANCH"
        exit 1
      fi
      set +e
      compose_config_warnings="$(docker compose -f docker-compose.yml config 2>&1 >/dev/null)"
      compose_config_status=$?
      set -e
      if [ "$compose_config_status" -ne 0 ]; then
        echo "$compose_config_warnings"
        exit "$compose_config_status"
      fi
      if echo "$compose_config_warnings" | grep -q "variable is not set"; then
        echo "Docker Compose reported unset variable interpolation in the secure compose file."
        echo 'Escape literal dollar signs in docker-compose.*.yaml values as double dollar signs, for example: pa$$word'
        exit 1
      fi
build_app:
  extends: .before_script_common
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - when: never
  tags:
    - HSS
  script:
    - docker compose -f docker-compose.yml build app --no-cache
    - docker tag w26-fmischeduler-yw72ij-app w26-fmischeduler-yw72ij-app:$CI_COMMIT_BRANCH
    - docker save w26-fmischeduler-yw72ij-app:$CI_COMMIT_BRANCH -o w26-fmischeduler-yw72ij-app.tar
  artifacts:
    paths:
      - w26-fmischeduler-yw72ij-app.tar
deploy_app:
  extends: .before_script_common
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - when: never
  tags:
    - HSS
  needs:
    - build_app
  script:
    - docker-compose rm -s -f app || true
    - docker rmi w26-fmischeduler-yw72ij-app:$CI_COMMIT_BRANCH || true
    - docker load -i w26-fmischeduler-yw72ij-app.tar
    - docker-compose up -d app
